# Builds and tests on every OS, packages a self-contained app (Java runtime included)
# for each platform, and publishes them: pushes to main update the rolling "snapshot"
# pre-release; a version tag (v1.2.3, matching build.gradle.kts) publishes that release;
# a beta/NAME branch publishes a "beta-NAME" pre-release of "Logsift Beta", which installs
# next to Logsift with its own settings (~/.logsift-beta).
name: snapshot

on:
  push:
    branches: [main, 'beta/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest,   target: windows-x64 }
          - { os: windows-11-arm,   target: windows-arm64 }
          - { os: macos-latest,     target: macos-arm64 }
          - { os: macos-15-intel,   target: macos-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew --no-daemon test installDist distZip

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ matrix.target }}
          path: |
            build/reports/tests
            build/screenshots
          if-no-files-found: ignore

      # WiX's own zip of its tools: faster than installing it with Chocolatey
      - name: Install WiX 3 (for the Windows installer)
        if: startsWith(matrix.target, 'windows-')
        run: |
          curl -sSfL -o wix.zip https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          mkdir -p /c/wix && unzip -q wix.zip -d /c/wix && rm wix.zip
          echo "C:/wix" >> "$GITHUB_PATH"

      - name: Package
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | sed -n 's/^version: //p' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $VERSION in build.gradle.kts"; exit 1
            fi
            LABEL=$VERSION
          elif [[ "$GITHUB_REF_NAME" == beta/* ]]; then
            LABEL=beta-${GITHUB_REF_NAME#beta/}
          else
            LABEL=snapshot
          fi
          NAME=Logsift-$LABEL-${{ matrix.target }}
          # A beta: its own settings, window and app name; no installers or file associations,
          # so it never replaces or takes over from the normal Logsift.
          # ZGC needs Windows 10 1803 / Server 2019 or later (Java won't start with it on Server 2016):
          # Windows uses G1, which runs on every Windows that Java 21 supports.
          case "${{ matrix.target }}" in windows-*) GC=-XX:+UseG1GC ;; *) GC=-XX:+UseZGC ;; esac
          BETA=(); MCP_PROPS=build/mcp-launcher.properties
          sed "s/-XX:+UseZGC/$GC/" packaging/mcp/launcher.properties > "$MCP_PROPS"
          grep -q -- "$GC" "$MCP_PROPS"
          if [[ "$LABEL" == beta-* ]]; then
            BETA=(--java-options -Dlogsift.channel=beta)
            sed -i.bak 's/^java-options=/java-options=-Dlogsift.channel=beta /' "$MCP_PROPS"
            grep -q 'logsift.channel=beta' "$MCP_PROPS"
          fi
          # splash screen, shown by the launcher before Java starts
          cp packaging/splash/splash.png packaging/splash/splash@2x.png build/install/logsift/lib/
          COMMON=(--name Logsift --input build/install/logsift/lib
                  --main-jar "logsift-$VERSION.jar" --main-class logsift.ui.LogsiftApp
                  --java-options "-Xmx2g $GC --enable-native-access=ALL-UNNAMED"
                  --java-options '-splash:$APPDIR/splash.png'
                  --add-modules java.base,java.desktop,java.prefs,java.logging,java.sql,jdk.unsupported,jdk.accessibility,java.security.jgss,jdk.crypto.ec,jdk.charsets,jdk.attach,java.management,java.management.rmi,jdk.naming.rmi,jdk.jfr,jdk.management.jfr
                  --add-launcher "logsift-mcp=$MCP_PROPS" ${BETA[@]+"${BETA[@]}"}
                  --vendor bdarwin --description "Viewer for very large log files")
          mkdir -p dist
          ASSOC=(--file-associations packaging/file-associations/log.properties)
          case "${{ matrix.target }}" in
            macos-*)
              if [ ${#BETA[@]} -gt 0 ]; then
                jpackage --type app-image --dest pkg --app-version "$VERSION" --icon packaging/icons/logsift.icns \
                  --mac-package-identifier io.github.bdarwin.logsift.beta --mac-package-name "Logsift Beta" "${COMMON[@]}"
                mv pkg/Logsift.app "pkg/Logsift Beta.app"
                jpackage --type dmg --dest dist --app-image "pkg/Logsift Beta.app" --name "Logsift Beta" --app-version "$VERSION"
                mv dist/*.dmg "dist/$NAME.dmg"
                ls -l dist
                exit 0
              fi
              jpackage --type app-image --dest pkg --app-version "$VERSION" --icon packaging/icons/logsift.icns "${ASSOC[@]}" "${COMMON[@]}"
              packaging/macos-file-types.sh pkg/Logsift.app
              jpackage --type dmg --dest dist --app-image pkg/Logsift.app --name Logsift --app-version "$VERSION"
              mv dist/Logsift-*.dmg "dist/$NAME.dmg"
              ;;
            windows-*)
              jpackage --type app-image --dest pkg --app-version "$VERSION" --icon packaging/icons/logsift.ico "${COMMON[@]}"
              pwsh -NoProfile -Command "Compress-Archive -Path pkg/Logsift -DestinationPath dist/$NAME.zip"
              if [ ${#BETA[@]} -gt 0 ]; then ls -l dist; exit 0; fi
              # Installer: per user (no admin rights needed), Start menu entry, "Open with Logsift"
              # on files and folders (not taking over .log files). jpackage can't add that, so its
              # installer script is built once, patched, and used for the real build.
              MSI=(--app-version "$VERSION" --icon packaging/icons/logsift.ico
                   --win-per-user-install --win-menu --win-menu-group Logsift --win-shortcut-prompt
                   --win-upgrade-uuid 2cf55e2a-4bbe-4a4c-8397-7b68517646a0)
              jpackage --type msi --dest msi-first --temp msi-temp "${MSI[@]}" "${COMMON[@]}"
              mkdir -p msi-res
              python packaging/windows/add-open-with.py msi-temp/config/main.wxs msi-res/main.wxs
              jpackage --type msi --dest dist --resource-dir msi-res "${MSI[@]}" "${COMMON[@]}"
              mv dist/Logsift-*.msi "dist/$NAME.msi"
              ;;
            linux-*)
              jpackage --type app-image --dest pkg --app-version "$VERSION" --icon packaging/icons/logsift.png "${COMMON[@]}"
              tar -C pkg -czf "dist/$NAME.tar.gz" Logsift
              if [ "${{ matrix.target }}" = linux-x64 ] && [ ${#BETA[@]} -gt 0 ]; then
                cp "build/distributions/logsift-$VERSION.zip" "dist/Logsift-$LABEL-any-java21.zip"
              elif [ "${{ matrix.target }}" = linux-x64 ]; then
                jpackage --type deb --dest dist --app-version "$VERSION" --linux-shortcut --icon packaging/icons/logsift.png "${ASSOC[@]}" "${COMMON[@]}"
                mv dist/*.deb "dist/$NAME.deb"
                # Plain zip that runs anywhere with Java 21+ installed.
                cp "build/distributions/logsift-$VERSION.zip" "dist/Logsift-$LABEL-any-java21.zip"
              fi
              ;;
          esac
          ls -l dist

      - name: The launchers' garbage collector (ZGC doesn't start on Windows Server 2016)
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r c; do # names may have spaces ("Logsift Beta.app")
            n=$((n + 1))
            echo "$c"
            case "${{ matrix.target }}" in
              windows-*)
                if grep -q 'UseZGC' "$c"; then echo "ZGC in a Windows launcher: $c"; exit 1; fi
                grep -q 'UseG1GC' "$c" || { echo "no G1 in $c"; exit 1; } ;;
              *)
                grep -q 'UseZGC' "$c" || { echo "no ZGC in $c"; exit 1; } ;;
            esac
          done < <(find pkg \( -name 'Logsift.cfg' -o -name 'logsift-mcp.cfg' \)) # the launchers, not Java's own jvm.cfg
          [ "$n" -eq 2 ] || { echo "expected the Logsift and logsift-mcp launchers, found $n"; exit 1; }
          # the zip that runs on any Java: its .bat scripts are for Windows too
          for b in build/install/logsift/bin/*.bat; do
            if grep -q 'UseZGC' "$b"; then echo "ZGC in $b"; exit 1; fi
            grep -q 'UseG1GC' "$b" || { echo "no G1 in $b"; exit 1; }
          done
          for sh in build/install/logsift/bin/logsift build/install/logsift/bin/logsift-mcp; do
            grep -q 'UseZGC' "$sh" || { echo "no ZGC in $sh"; exit 1; }
          done

      - name: Try logsift-mcp in the app (a coding agent's first requests)
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos-*) MCP=$(ls -d pkg/*.app | head -1)/Contents/MacOS/logsift-mcp ;;
            windows-*) MCP=pkg/Logsift/logsift-mcp.exe ;;
            linux-*) MCP=pkg/Logsift/bin/logsift-mcp ;;
          esac
          mkdir -p mcp-try
          printf '2026-10-21 10:00:00.000 ERROR [main] App - Payment declined token=abc123secret\n' > mcp-try/app.log
          LOG=$(cd mcp-try && pwd -W 2>/dev/null || pwd)/app.log
          LOG=${LOG//\\//}
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search","arguments":{"log":"'"$LOG"'","query":"Payment"}}}'
          } | "$MCP" --root mcp-try > mcp-out.txt
          cat mcp-out.txt
          [ "$(wc -l < mcp-out.txt | tr -d ' ')" = 3 ] || { echo "expected 3 answers"; exit 1; }
          grep -q '"serverInfo":{"name":"logsift"' mcp-out.txt
          grep -q '"name":"analyze_gc"' mcp-out.txt
          grep -q '1 line matches' mcp-out.txt
          grep -q 'token=‹masked:secret›' mcp-out.txt
          if grep -q abc123secret mcp-out.txt; then echo "secret not masked"; exit 1; fi
          "$MCP" --version
          rm -rf mcp-try mcp-out.txt

      - name: Try the Windows installer (install, check, uninstall)
        if: matrix.target == 'windows-x64' && !startsWith(github.ref_name, 'beta/')
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter Logsift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Logsift.exe not installed under LOCALAPPDATA" }
          Write-Host "Installed: $($exe.FullName)"
          $out = & $exe.FullName --version | Out-String
          Write-Host "Reports: $out"
          $cmd = 'HKCU:\Software\Classes\*\shell\Logsift\command'
          if (-not (Test-Path -LiteralPath $cmd)) { throw "no Open with Logsift on files" }
          Write-Host "Open with Logsift: $((Get-ItemProperty -LiteralPath $cmd).'(default)')"
          if (-not (Test-Path -LiteralPath 'HKCU:\Software\Classes\Directory\shell\Logsift\command')) { throw "no Open with Logsift on folders" }
          if (-not (Test-Path -LiteralPath 'HKCU:\Software\Classes\.log\OpenWithList\Logsift.exe')) { throw "not in Open with for .log" }
          $log = 'HKCU:\Software\Classes\.log'
          $default = (Get-ItemProperty -LiteralPath $log -ErrorAction SilentlyContinue).'(default)'
          if ($default -and $default -match 'Logsift') { throw ".log files were taken over: $default" }
          if (-not (Test-Path (Join-Path $exe.Directory.FullName 'app\splash.png'))) { throw "no splash screen" }
          $mcp = Join-Path $exe.Directory.FullName 'logsift-mcp.exe'
          if (-not (Test-Path $mcp)) { throw "logsift-mcp.exe not installed" }
          Write-Host "logsift-mcp: $(& $mcp --version | Out-String)"
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe.FullName) { throw "still there after uninstall" }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\*\shell\Logsift') { throw "Open with Logsift left behind after uninstall" }

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # The UI tests on a real screen, beside the builds (the release waits for them too)
  visual:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Visual tests (Linux, virtual display, 200 MB log)
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb fonts-dejavu fonts-noto-cjk
          xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew --no-daemon visualTest -PsizeMb=200
          rm -rf build/visual

      - name: Visual tests (Windows desktop, 200 MB log)
        if: matrix.target == 'windows-x64'
        run: |
          ./gradlew --no-daemon visualTest -PsizeMb=200
          rm -rf build/visual

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-visual-${{ matrix.target }}
          path: |
            build/reports/tests
            build/screenshots
          if-no-files-found: ignore

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/beta/'))
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          V=${GITHUB_REF_NAME#v}
          NOTES=docs/releases/$GITHUB_REF_NAME.md
          [ -f "$NOTES" ] || { echo "Missing $NOTES"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "Logsift $V" --notes-file "$NOTES"

      - name: Publish beta release
        if: startsWith(github.ref, 'refs/heads/beta/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          B=beta-${GITHUB_REF_NAME#beta/}
          gh release delete "$B" --cleanup-tag --yes || true
          gh release create "$B" dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Logsift Beta: ${GITHUB_REF_NAME#beta/}" \
            --notes "Beta build of branch $GITHUB_REF_NAME (commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')).

          **Logsift Beta** installs and runs next to Logsift: it has its own settings (\`~/.logsift-beta\`) and its own window, and doesn't register file types. Its \`logsift-mcp\` is inside it too.

          | File | For |
          |---|---|
          | \`Logsift-$B-macos-arm64.dmg\` / \`-macos-x64.dmg\` | macOS: drag **Logsift Beta** to Applications. If it says the app is damaged, run \`xattr -dr com.apple.quarantine \"/Applications/Logsift Beta.app\"\` |
          | \`Logsift-$B-windows-x64.zip\` / \`-windows-arm64.zip\` | Windows: unzip anywhere, run \`Logsift\\Logsift.exe\` |
          | \`Logsift-$B-linux-x64.tar.gz\` / \`-linux-arm64.tar.gz\` | Linux: unpack, run \`Logsift/bin/Logsift\` |
          | \`Logsift-$B-any-java21.zip\` | Any OS with Java 21+: run \`bin/logsift\` (its own settings only when started with \`-Dlogsift.channel=beta\`, see JAVA_OPTS) |"

      - name: Publish snapshot release
        if: github.ref_type != 'tag' && !startsWith(github.ref, 'refs/heads/beta/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Snapshot build" \
            --notes "Latest build of main (commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')).

          | File | For |
          |---|---|
          | \`Logsift-snapshot-windows-x64.msi\` / \`-windows-arm64.msi\` | Windows installer (no admin rights needed) |
          | \`Logsift-snapshot-windows-x64.zip\` / \`-windows-arm64.zip\` | Windows without installing: unzip, run \`Logsift\\Logsift.exe\` |
          | \`Logsift-snapshot-macos-arm64.dmg\` / \`-macos-x64.dmg\` | macOS Apple Silicon / Intel |
          | \`Logsift-snapshot-linux-x64.deb\` | Debian / Ubuntu |
          | \`Logsift-snapshot-linux-x64.tar.gz\` / \`-linux-arm64.tar.gz\` | Other Linux: unpack, run \`Logsift/bin/Logsift\` |
          | \`Logsift-snapshot-any-java21.zip\` | Any OS with Java 21+ installed: run \`bin/logsift\` |

          The native builds include their own Java runtime. They are not code-signed:
          - macOS: if it says the app is damaged or can't be opened, run \`xattr -dr com.apple.quarantine /Applications/Logsift.app\`.
          - Windows: SmartScreen may warn; choose More info → Run anyway."
