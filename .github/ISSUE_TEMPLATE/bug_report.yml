name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, a few steps or a small sample log that shows the problem. Remove anything private first.
  - type: input
    id: version
    attributes:
      label: Logsift version
      description: Help → About Logsift (or Logsift → About Logsift on macOS)
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 (x64)"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: If Logsift showed an error window, paste its details here (Copy Details). They are also in ~/.logsift/errors.log.
      render: text
