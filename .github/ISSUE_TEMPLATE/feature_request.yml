name: Feature request
description: Suggest an idea for Logsift
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task, in your own words. An example log line helps.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Logsift help?
