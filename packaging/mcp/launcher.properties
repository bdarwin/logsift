# logsift-mcp: Logsift's tools for coding agents, a second launcher in the same app.
# It talks on standard input and output, so: a console program on Windows, no splash screen,
# no window, no shortcut or menu entry.
main-class=logsift.agent.mcp.McpMain
description=Logsift MCP
java-options=-Xmx2g -XX:+UseZGC --enable-native-access=ALL-UNNAMED -Djava.awt.headless=true
win-console=true
win-shortcut=false
win-menu=false
linux-shortcut=false
